    contents:
      /usr/bin/false: { symlink: ../lib/cargo/bin/coreutils/false }
      /usr/bin/true:  { symlink: ../lib/cargo/bin/coreutils/true }

  # Redirection
  redirection:
    essential:
      rust-coreutils_redirection:
    contents:
      /usr/bin/tee: { symlink: ../lib/cargo/bin/coreutils/tee }

  # File name manipulation
  file-name-manipulation:
