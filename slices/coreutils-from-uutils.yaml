    contents:
      /usr/bin/df:      { symlink: ../lib/cargo/bin/coreutils/df }
      /usr/bin/du:      { symlink: ../lib/cargo/bin/coreutils/du }
      /usr/bin/sync:    { symlink: ../lib/cargo/bin/coreutils/sync }
      /usr/bin/truncate: { symlink: ../lib/cargo/bin/coreutils/truncate }

  # Printing text
  printing-text:
