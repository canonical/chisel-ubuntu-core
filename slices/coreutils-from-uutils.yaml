      /usr/bin/nice:   { symlink: ../lib/cargo/bin/coreutils/nice }
      /usr/bin/nohup:  { symlink: ../lib/cargo/bin/coreutils/nohup }
      /usr/bin/stdbuf: { symlink: ../lib/cargo/bin/coreutils/stdbuf }
      /usr/bin/timeout: { symlink: ../lib/cargo/bin/coreutils/timeout }

  # Delaying
  delaying:
