    contents:
      /usr/bin/comm: { symlink: ../lib/cargo/bin/coreutils/comm }
      /usr/bin/ptx:  { symlink: ../lib/cargo/bin/coreutils/ptx }
      /usr/bin/shuf: { symlink: ../lib/cargo/bin/coreutils/shuf }
      /usr/bin/tsort: { symlink: ../lib/cargo/bin/coreutils/tsort }
      /usr/bin/uniq: { symlink: ../lib/cargo/bin/coreutils/uniq }

  # Operating on fields
  operating-on-fields:
    essential:
      coreutils-from-uutils_cut:
      coreutils-from-uutils_join:
      rust-coreutils_operating-on-fields:
