      coreutils-from-uutils_readlink:
      coreutils-from-uutils_rmdir:
      coreutils-from-uutils_unlink:
      rust-coreutils_special-file-types:
    contents:
      /usr/bin/mkfifo: { symlink: ../lib/cargo/bin/coreutils/mkfifo }
      /usr/bin/mknod:  { symlink: ../lib/cargo/bin/coreutils/mknod }

  # Changing file attributes
  changing-file-attributes:
    essential:
      coreutils-from-uutils_chmod:
      coreutils-from-uutils_chown:
      coreutils-from-uutils_touch:
      rust-coreutils_changing-file-attributes:
    contents:
      /usr/bin/chgrp: { symlink: ../lib/cargo/bin/coreutils/chgrp }

  # File space usage
  file-space-usage:
