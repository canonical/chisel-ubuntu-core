      /usr/bin/pathchk: { symlink: ../lib/cargo/bin/coreutils/pathchk }
      /usr/bin/realpath: { symlink: ../lib/cargo/bin/coreutils/realpath }

  # Working context
  working-context:
    essential:
      rust-coreutils_working-context:
    contents:
      /usr/bin/printenv: { symlink: ../lib/cargo/bin/coreutils/printenv }
      /usr/bin/pwd:      { symlink: ../lib/cargo/bin/coreutils/pwd }
      /usr/bin/stty:     { symlink: ../lib/cargo/bin/coreutils/stty }
      /usr/bin/tty:      { symlink: ../lib/cargo/bin/coreutils/tty }

  # User information
  user-information:
