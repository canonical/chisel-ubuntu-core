package: coreutils-from-uutils

essential:
  coreutils-from-uutils_copyright:

slices:
  bins:
    essential:
      coreutils-from-uutils_basic-operations:
      coreutils-from-uutils_changing-file-attributes:
      coreutils-from-uutils_conditions:
      coreutils-from-uutils_delaying:
      coreutils-from-uutils_directory-listing:
      coreutils-from-uutils_file-name-manipulation:
      coreutils-from-uutils_file-space-usage:
      coreutils-from-uutils_formatting-file-contents:
      coreutils-from-uutils_modified-command-invocation:
      coreutils-from-uutils_numeric-operations:
      coreutils-from-uutils_operating-on-characters:
      coreutils-from-uutils_operating-on-fields:
      coreutils-from-uutils_operating-on-sorted-files:
      coreutils-from-uutils_output-of-entire-files:
      coreutils-from-uutils_output-of-parts-of-files:
      coreutils-from-uutils_printing-text:
      coreutils-from-uutils_redirection:
      coreutils-from-uutils_selinux-context:
      coreutils-from-uutils_special-file-types:
      coreutils-from-uutils_summarizing-files:
      coreutils-from-uutils_system-context:
      coreutils-from-uutils_user-information:
      coreutils-from-uutils_working-context:

  libs:
    essential:
      rust-coreutils_libs:

  # Output of entire files
  output-of-entire-files:
    essential:
      coreutils-from-uutils_cat:
      coreutils-from-uutils_od-utility:
      rust-coreutils_output-of-entire-files:
    contents:
      /usr/bin/base32:  { symlink: ../lib/cargo/bin/coreutils/base32 }
      /usr/bin/base64:  { symlink: ../lib/cargo/bin/coreutils/base64 }
      /usr/bin/basenc:  { symlink: ../lib/cargo/bin/coreutils/basenc }
      /usr/bin/nl:      { symlink: ../lib/cargo/bin/coreutils/nl }
      /usr/bin/tac:     { symlink: ../lib/cargo/bin/coreutils/tac }

  # Formatting file contents
  formatting-file-contents:
    essential:
      rust-coreutils_formatting-file-contents:
    contents:
      /usr/bin/fmt:  { symlink: ../lib/cargo/bin/coreutils/fmt }
      /usr/bin/fold: { symlink: ../lib/cargo/bin/coreutils/fold }
      /usr/bin/pr:   { symlink: ../lib/cargo/bin/coreutils/pr }

  # Output of parts of files
  output-of-parts-of-files:
    essential:
      coreutils-from-uutils_head:
      coreutils-from-uutils_split:
      coreutils-from-uutils_tail:
      rust-coreutils_output-of-parts-of-files:
    contents:
      /usr/bin/csplit: { symlink: ../lib/cargo/bin/coreutils/csplit }

  # Summarizing files
  summarizing-files:
    essential:
      rust-coreutils_summarizing-files:
    contents:
      /usr/bin/b2sum:   { symlink: ../lib/cargo/bin/coreutils/b2sum }
      /usr/bin/b3sum:   { symlink: ../lib/cargo/bin/coreutils/b3sum }
      /usr/bin/cksum:   { symlink: ../lib/cargo/bin/coreutils/cksum }
      /usr/bin/hashsum: { symlink: ../lib/cargo/bin/coreutils/hashsum }
      /usr/bin/md5sum:  { symlink: ../lib/cargo/bin/coreutils/md5sum }
      /usr/bin/sha1sum: { symlink: ../lib/cargo/bin/coreutils/sha1sum }
      /usr/bin/sha224sum: { symlink: ../lib/cargo/bin/coreutils/sha224sum }
      /usr/bin/sha256sum: { symlink: ../lib/cargo/bin/coreutils/sha256sum }
      /usr/bin/sha384sum: { symlink: ../lib/cargo/bin/coreutils/sha384sum }
      /usr/bin/sha512sum: { symlink: ../lib/cargo/bin/coreutils/sha512sum }
      /usr/bin/sha3-224sum: { symlink: ../lib/cargo/bin/coreutils/sha3 }
      /usr/bin/sha3-256sum: { symlink: ../lib/cargo/bin/coreutils/sha3 }
      /usr/bin/sha3-384sum: { symlink: ../lib/cargo/bin/coreutils/sha3 }
      /usr/bin/sha3-512sum: { symlink: ../lib/cargo/bin/coreutils/sha3 }
      /usr/bin/sha3sum:     { symlink: ../lib/cargo/bin/coreutils/sha3sum }
      /usr/bin/shake128sum: { symlink: ../lib/cargo/bin/coreutils/shake128sum }
      /usr/bin/shake256sum: { symlink: ../lib/cargo/bin/coreutils/shake256sum }
      /usr/bin/sum:      { symlink: ../lib/cargo/bin/coreutils/sum }
      /usr/bin/wc:       { symlink: ../lib/cargo/bin/coreutils/wc }

