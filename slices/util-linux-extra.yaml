package: util-linux-extra

essential:
  util-linux-extra_copyright:

slices:
  # Meta slice pulling in all the functional groups
  bins:
    essential:
      util-linux-extra_block-devices:
      util-linux-extra_file-system:
      util-linux-extra_hardware:
      util-linux-extra_process:
      util-linux-extra_login:
      util-linux-extra_kernel:
      util-linux-extra_tty:

  # Extra block / partition tools
  block-devices:
    essential:
      libblkid1_libs:
      libc6_libs:
      libselinux1_libs:
      libsmartcols1_libs:
    contents:
      /usr/bin/addpart:
      /usr/bin/delpart:
      /usr/bin/resizepart:
      /usr/bin/blkzone:
      /usr/sbin/blkpr:

  # Extra filesystem tools
  file-system:
    essential:
      libblkid1_libs:
      libc6_libs:
      libselinux1_libs:
      libsmartcols1_libs:
      libuuid1_libs:
      zlib1g_libs:
    contents:
      /usr/bin/isosize:
      /usr/sbin/fsck.cramfs:
      /usr/sbin/fsck.minix:
      /usr/sbin/mkfs.bfs:
      /usr/sbin/mkfs.cramfs:
      /usr/sbin/mkfs.minix:

  # Hardware / clock / watchdog, CPU and memory control
  hardware:
    essential:
      libc6_libs:
      libselinux1_libs:
      libsmartcols1_libs:
      libsystemd0_libs:
    contents:
      /usr/bin/chcpu:
      /usr/bin/chmem:
      /usr/bin/lsclocks:
      /usr/bin/lsirq:
      /usr/bin/lsmem:
      /usr/bin/wdctl:
      /usr/sbin/hwclock:

  # Process / scheduling / fd-related helpers
  process:
    essential:
      libc6_libs:
      libselinux1_libs:
      libsmartcols1_libs:
      libsystemd0_libs:
    contents:
      /usr/bin/bits:
      /usr/bin/coresched:
      /usr/bin/exch:
      /usr/bin/fadvise:
      /usr/bin/fincore:
      /usr/bin/lsfd:
      /usr/bin/pipesz:
      /usr/bin/sg:
      /usr/bin/waitpid:

  # Login / accounts related helpers
  login:
    essential:
      libaudit1_libs:
      libc6_libs:
      libcrypt1_libs:
      liblastlog2-2_libs:
      libselinux1_libs:
      libsmartcols1_libs:
    contents:
      /usr/bin/lslogins:
      /usr/bin/newgrp:
      /usr/sbin/ctrlaltdel:

  # Kernel / root switching / namespaces-ish
  kernel:
    essential:
      libc6_libs:
      libselinux1_libs:
    contents:
      /usr/bin/enosys:
      /usr/bin/pivot_root:
      /usr/bin/switch_root:

  # TTY / serial helpers
  tty:
    essential:
      libc6_libs:
      libselinux1_libs:
    contents:
      /usr/bin/ldattach:

  # Misc small utilities
  misc:
    essential:
      libc6_libs:
    contents:
      /usr/bin/rename.ul:

  # single binary slices
  pivot-root:
    essential:
      libc6_libs:
    contents:
      /usr/bin/pivot_root:

  switch-root:
    essential:
      libc6_libs:
    contents:
      /usr/bin/switch_root:

  copyright:
    contents:
      /usr/share/doc/util-linux-extra/copyright:
