# This package contains the basic file, shell and text manipulation utilities
# which are expected to exist on every operating system.
package: coreutils

essential:
  coreutils_copyright:

# From 25.10 onward, coreutils ships can either deliver coreutils-from-uutils
# or coreutils-from-uutils. coreutils-from-uutils is the default in 26.04.
slices:
  libs:
    essential:
      coreutils-from-uutils_libs:

  bins:
    essential:
      coreutils-from-uutils_bins:

  output-of-entire-files:
    essential:
      coreutils-from-uutils_output-of-entire-files:

  formatting-file-contents:
    essential:
      coreutils-from-uutils_formatting-file-contents:

  output-of-parts-of-files:
    essential:
      coreutils-from-uutils_output-of-parts-of-files:

  summarizing-files:
    essential:
      coreutils-from-uutils_summarizing-files:

  operating-on-sorted-files:
    essential:
      coreutils-from-uutils_operating-on-sorted-files:

  operating-on-fields:
    essential:
      coreutils-from-uutils_operating-on-fields:

  operating-on-characters:
    essential:
      coreutils-from-uutils_operating-on-characters:

  directory-listing:
    essential:
      coreutils-from-uutils_directory-listing:

  basic-operations:
    essential:
      coreutils-from-uutils_basic-operations:

  special-file-types:
    essential:
      coreutils-from-uutils_special-file-types:

  changing-file-attributes:
    essential:
      coreutils-from-uutils_changing-file-attributes:

  file-space-usage:
    essential:
      coreutils-from-uutils_file-space-usage:

  printing-text:
    essential:
      coreutils-from-uutils_printing-text:

  conditions:
    essential:
      coreutils-from-uutils_conditions:

  redirection:
    essential:
      coreutils-from-uutils_redirection:

  file-name-manipulation:
    essential:
      coreutils-from-uutils_file-name-manipulation:

  working-context:
    essential:
      coreutils-from-uutils_working-context:

  user-information:
    essential:
      coreutils-from-uutils_user-information:

  system-context:
    essential:
      coreutils-from-uutils_system-context:

  selinux-context:
    essential:
      coreutils-from-uutils_selinux-context:

  modified-command-invocation:
    essential:
      coreutils-from-uutils_modified-command-invocation:

  delaying:
    essential:
      coreutils-from-uutils_delaying:

  numeric-operations:
    essential:
      coreutils-from-uutils_numeric-operations:

  # Single-binary slices
  env:
    essential:
      coreutils-from-uutils_env:

  expr:
    essential:
      coreutils-from-uutils_expr:

  mkdir:
    essential:
      coreutils-from-uutils_mkdir:

  echo:
    essential:
      coreutils-from-uutils_echo:

  ln-utility:
    essential:
      coreutils-from-uutils_ln-utility:

  rm-utility:
    essential:
      coreutils-from-uutils_rm-utility:

  readlink:
    essential:
      coreutils-from-uutils_readlink:

  sort:
    essential:
      coreutils-from-uutils_sort:

  dirname:
    essential:
      coreutils-from-uutils_dirname:

  touch:
    essential:
      coreutils-from-uutils_touch:

  printf:
    essential:
      coreutils-from-uutils_printf:

  basename:
    essential:
      coreutils-from-uutils_basename:

  chmod:
