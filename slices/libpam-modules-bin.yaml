package: libpam-modules-bin

essential:
  libpam-modules-bin_copyright:

slices:
  # Core authentication helpers
  auth:
    essential:
      libaudit1_libs:
      libc6_libs:
      libcrypt1_libs:
      libpam0g_libs:
      libselinux1_libs:
      libsystemd0_libs:
    contents:
      /usr/sbin/faillock:
      /usr/sbin/mkhomedir_helper:
      /usr/sbin/pam_extrausers_chkpwd:
      /usr/sbin/pam_extrausers_update:
      /usr/sbin/pam_timestamp_check:
      /usr/sbin/pwhistory_helper:
      /usr/sbin/unix_chkpwd:
      /usr/sbin/unix_update:

  # Password history management
  pwhistory:
    essential:
      libc6_libs:
      libpam0g_libs:
    contents:
      /usr/sbin/pwhistory_helper:

  # Account lockout management
  faillock:
    essential:
      libaudit1_libs:
      libc6_libs:
      libpam0g_libs:
      libsystemd0_libs:
    contents:
      /usr/sbin/faillock:

  # Home directory creation
  mkhomedir:
    essential:
      libc6_libs:
      libpam0g_libs:
      libselinux1_libs:
    contents:
      /usr/sbin/mkhomedir_helper:

  # Namespace isolation
  namespace:
    hint: Isolate user namespaces
    essential:
      libpam0g_libs:
      libsystemd0_libs:
      systemd_bins:
    contents:
      /usr/sbin/pam_namespace_helper:
      /usr/lib/systemd/system/pam_namespace.service:

  # Timestamp-based authentication
  timestamp:
    essential:
      libc6_libs:
      libpam0g_libs:
    contents:
      /usr/sbin/pam_timestamp_check:

  # Extra users support (non-standard user databases)
  extrausers:
    essential:
      libc6_libs:
      libcrypt1_libs:
      libpam0g_libs:
    contents:
      /usr/sbin/pam_extrausers_chkpwd:
      /usr/sbin/pam_extrausers_update:

  # Standard installation - includes commonly used helpers
  standard:
    essential:
      libpam-modules-bin_auth:
      libpam-modules-bin_pwhistory:
      libpam-modules-bin_faillock:
      libpam-modules-bin_mkhomedir:

  copyright:
    contents:
      /usr/share/doc/libpam-modules-bin/copyright: