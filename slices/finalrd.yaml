package: finalrd

essential:
  - finalrd_copyright

slices:
  bins:
    contents:
      /usr/bin/finalrd:

  config:
    contents:
      /usr/lib/finalrd/finalrd-static.conf:

  services:
    essential:
      - libc6_libs
      - finalrd_bins
      - finalrd_config
    contents:
      /lib/systemd/system/finalrd.service:

  copyright:
    contents:
      /usr/share/doc/finalrd/copyright: