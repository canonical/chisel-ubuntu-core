package: plymouth-label-ft

essential:
  - plymouth-label-ft_copyright

slices:
  libs:
    essential:
      - libc6_libs
      - libfreetype6_libs
      - libplymouth5_libs
    contents:
      /usr/lib/*-linux-*/plymouth/label-freetype.so:

  copyright:
    contents:
      /usr/share/doc/plymouth-label-ft/copyright:
