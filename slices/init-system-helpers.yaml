package: init-system-helpers

essential:
  init-system-helpers_copyright:

slices:
  core:
    essential:
      init-system-helpers_config:
      init-system-helpers_var:
    contents:
      /usr/sbin/invoke-rc.d:
      /usr/sbin/service:
      /usr/sbin/update-rc.d:

  # just a pointer to core now
  bins:
    essential:
      init-system-helpers_core:

  no-systemd:
    contents:
      /usr/bin/deb-systemd-helper:
      /usr/bin/deb-systemd-invoke:

  config:
    contents:
      /etc/rc0.d/:
      /etc/rc1.d/:
      /etc/rc2.d/:
      /etc/rc3.d/:
      /etc/rc4.d/:
      /etc/rc5.d/:
      /etc/rc6.d/:
      /etc/rcS.d/:
      /etc/systemd/system/:
      /etc/systemd/user/:

  var:
    contents:
      /var/lib/systemd/:

  copyright:
    contents:
      /usr/share/doc/init-system-helpers/copyright:
